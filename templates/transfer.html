{% extends "base.html" %}
{% block title %}ITB Bank – Transfer{% endblock %}
{% block content %}

<div class="form-page">
  <div class="form-card">
    <h2>↔ Transfer Money</h2>
    <p class="form-sub">Send funds to any ITB Bank account number.</p>

    {% if errors %}
    <div class="alert alert-error">
      {% for e in errors %}<div>⚠ {{ e }}</div>{% endfor %}
    </div>
    {% endif %}

    <form method="post">
      <div class="form-group">
        <label>Receiver Account Number <span class="req">*</span></label>
        <input type="text" name="receiver_account" placeholder="e.g. ACC0002" required/>
      </div>
      <div class="form-group">
        <label>Amount (₹) <span class="req">*</span></label>
        <input type="number" name="amount" placeholder="Enter amount" min="1" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Transfer Now</button>
    </form>

    <div class="form-footer"><a href="/dashboard">← Back to Dashboard</a></div>
  </div>
</div>


{% endblock %}

{% endblock %}
